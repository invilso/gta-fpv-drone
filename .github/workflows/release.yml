# Cut a GitHub Release whenever a version tag is pushed. The human decides
# what's a release and names it (git tag v0.2b && git push origin v0.2b);
# this builds the clean archive and publishes the release. No manual zip,
# no web UI, no token setup -- Actions provides GITHUB_TOKEN.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so --generate-notes can diff from the previous tag

      - name: Build clean release archive
        run: |
          TAG="${GITHUB_REF_NAME}"
          git archive --format=zip --prefix=gta-fpv-drone/ \
            -o "gta-fpv-drone-${TAG}.zip" "$TAG"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Anything that isn't a bare vX.Y / vX.Y.Z (e.g. a 'b'/'beta'/'rc'
          # suffix) is flagged as a pre-release so it never shows as Latest.
          PRERELEASE=""
          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+){1,2}$ ]]; then
            PRERELEASE="--prerelease"
          fi
          gh release create "$TAG" "gta-fpv-drone-${TAG}.zip" \
            --title "$TAG" \
            --generate-notes \
            $PRERELEASE
